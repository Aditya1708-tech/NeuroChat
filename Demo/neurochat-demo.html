<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NeuroChat – Your Intelligent Conversation Partner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
/* ===== Design tokens (spec §14.5) ===== */
:root{--cyan4:#8B5CF6;--cyan7:#8B5CF6;--blue6:#6366F1;--purple7:#8B5CF6;--lav:#EDE9FE;--bg-page:#F8FAFC;--bg-soft:#EDE9FE;--surface:#FFFFFF;--glass:rgba(255,255,255,.78);--tx:#111827;--tx2:#6B7280;--txm:#6B7280;--border:#E5E7EB;--bs:#D1D5DB;--ok:#16A34A;--warn:#B45309;--err:#DC2626;
--g-primary:linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%);--g-soft:linear-gradient(135deg,#F5F3FF,#EDE9FE);--g-glow:radial-gradient(60% 60% at 50% 40%,rgba(139,92,246,.24),rgba(99,102,241,.14) 50%,transparent 100%);
--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:24px;--sh-md:0 4px 16px rgba(99,102,241,.08);--sh-lg:0 12px 40px rgba(99,102,241,.14);--gi:.16;
--glow-sm:0 0 0 1px rgba(99,102,241,.10),0 4px 18px rgba(139,92,246,var(--gi));--glow-md:0 0 0 1px rgba(99,102,241,.16),0 8px 30px rgba(99,102,241,.22);--ring:0 0 0 3px #fff,0 0 0 5px #6366F1;
--fh:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif;--fb:'Inter','Noto Sans Devanagari',system-ui,sans-serif;--fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1);--dur:200ms}
[data-theme=dark]{--bg-page:#0F1020;--bg-soft:#1B1A3A;--surface:#161730;--glass:rgba(22,23,48,.78);--tx:#F3F4F6;--tx2:#C7C9D9;--txm:#9CA3AF;--border:#2A2B4A;--bs:#3B3D63;--g-soft:linear-gradient(135deg,#1B1A3A,#241D4A);--gi:.28;--ring:0 0 0 3px #0F1020,0 0 0 5px #A5B4FC}
@media(prefers-reduced-motion:reduce){:root{--dur:0ms}*{animation:none!important}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:400 1rem/1.6 var(--fb);background:var(--bg-page);color:var(--tx);padding-top:env(safe-area-inset-top,0)}
h1,h2,h3{font-family:var(--fh);line-height:1.2}
a{color:var(--blue6)}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:var(--r-sm)}
button{font:inherit;cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
.btn{min-height:44px;padding:0 20px;border-radius:var(--r-md);border:1px solid var(--bs);background:var(--surface);color:var(--blue6);font-weight:600;transition:all var(--dur) var(--ease);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--bg-soft)}
.btn.p{background:var(--g-primary);color:#fff;border:0;box-shadow:var(--glow-sm)}
.btn.p:hover{box-shadow:var(--glow-md);transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:var(--r-md);color:var(--tx2);font-size:18px}
.ib:hover{background:var(--bg-soft)}
.badge{display:inline-flex;gap:4px;align-items:center;background:var(--bg-soft);color:var(--blue6);border-radius:999px;font-size:.75rem;font-weight:600;padding:2px 10px}
[data-theme=dark] .badge{color:#C4B5FD}
.gt{background:var(--g-primary);-webkit-background-clip:text;background-clip:text;color:transparent}
[data-theme=dark] .gt{background:linear-gradient(135deg,#A5B4FC,#C4B5FD);-webkit-background-clip:text;background-clip:text}
.demo-bar{background:var(--tx);color:var(--bg-page);font-size:.8rem;text-align:center;padding:6px 12px}
/* landing */
nav.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
nav.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:8px;font:700 1.2rem var(--fh);color:var(--tx);text-decoration:none}
.sp{flex:1}
.links{display:flex;gap:8px;align-items:center}
.menu-b{display:none}
.hero{position:relative;padding:72px 0 56px;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-20% -10% auto 30%;height:120%;background:var(--g-glow);pointer-events:none}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.25rem,5vw,3.75rem);font-weight:800;line-height:1.1;margin-bottom:16px}
.hero p{color:var(--tx2);max-width:52ch;margin-bottom:24px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.vis{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:20px;display:grid;gap:12px}
.vis .u{justify-self:end;background:var(--g-primary);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px}
.vis .a{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue6);padding:10px 14px;border-radius:16px;color:var(--tx2)}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue6);margin-right:4px;animation:bl 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
section.s{padding:56px 0}
section.s.soft{background:var(--g-soft)}
.s h2{font-size:1.75rem;margin-bottom:8px}.s .sub{color:var(--tx2);margin-bottom:28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-md);padding:20px}
.card h3{font-size:1.05rem;margin-bottom:6px}.card p{color:var(--tx2);font-size:.95rem}
.uc{cursor:pointer;text-align:left;font:inherit;color:inherit;transition:all var(--dur) var(--ease)}
.uc:hover{box-shadow:var(--sh-lg);transform:translateY(-2px)}
.trust{border:1px solid var(--warn);background:var(--surface);border-left-width:4px;border-radius:var(--r-lg);padding:20px}

.band{padding:48px 20px;text-align:center;background:var(--g-primary);color:#fff}

footer .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between}
footer a{margin-right:14px}
/* auth */
.authbg{min-height:calc(100dvh - 30px);display:grid;place-items:center;padding:20px;background:var(--g-glow),var(--bg-page)}
.auth{width:100%;max-width:440px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:var(--r-xl);box-shadow:var(--sh-lg);padding:28px}
.auth h1{font-size:1.6rem;margin:12px 0 4px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input[type=text],input[type=email],input[type=password],select{width:100%;min-height:44px;padding:0 12px;border:1px solid var(--bs);border-radius:var(--r-md);background:var(--surface);color:var(--tx);font:inherit}
input:focus,select:focus,textarea:focus{border-color:var(--blue6);box-shadow:var(--glow-sm);outline:none}
.err{color:var(--err);font-size:.85rem;margin-top:4px;min-height:1px}
[data-theme=dark] .err{color:#FCA5A5}
.meter{height:6px;background:var(--border);border-radius:9px;margin-top:6px;overflow:hidden}.meter i{display:block;height:100%;background:var(--g-primary);width:0;transition:width var(--dur)}
.small{font-size:.85rem;color:var(--txm)}
.or{display:flex;align-items:center;gap:10px;color:var(--txm);font-size:.85rem;margin:16px 0}.or:before,.or:after{content:"";flex:1;border-top:1px solid var(--border)}
/* app */
.app{display:flex;height:calc(100dvh - 30px)}
.side{width:280px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:12px;gap:10px;transition:transform var(--dur) var(--ease)}
.clist{flex:1;overflow:auto;display:grid;gap:2px;align-content:start}
.ci{display:flex;align-items:center;border-radius:var(--r-md);min-height:44px}
.ci button.t{flex:1;text-align:left;background:none;border:0;padding:8px 10px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:var(--r-md)}
.ci:hover{background:var(--bg-soft)}
.ci.on{background:var(--g-soft);box-shadow:var(--glow-sm)}
.ci .ib{width:32px;height:32px;font-size:14px}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.tb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.tb h2{font-size:1rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ml{flex:1;overflow:auto;padding:20px 16px}
.col{max-width:760px;margin:auto;display:grid;gap:16px}
.mu{justify-self:end;max-width:80%;background:var(--g-primary);color:#fff;padding:10px 14px;border-radius:16px 16px 4px 16px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.ma{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue6);border-radius:16px;padding:12px 16px;line-height:1.65;animation:fi var(--dur) var(--ease)}
@keyframes fi{from{opacity:0;transform:translateY(4px)}}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.av{width:26px;height:26px;border-radius:50%;background:var(--g-primary);box-shadow:var(--glow-sm);display:grid;place-items:center;color:#fff;font-size:12px}
.ma p{margin:6px 0}.ma ul{margin:6px 0 6px 20px}
.ma code{font-family:var(--fm);font-size:.875rem;background:var(--bg-soft);padding:1px 5px;border-radius:5px}
.cb{background:var(--bg-soft);border-radius:var(--r-md);margin:8px 0;overflow:hidden}
.cb header{display:flex;justify-content:space-between;align-items:center;padding:4px 10px;font-size:.8rem;color:var(--txm);border-bottom:1px solid var(--border)}
.cb header button{background:none;border:0;color:var(--blue6);font-weight:600;min-height:32px}
.cb pre{padding:10px 12px;overflow-x:auto;font:.875rem/1.6 var(--fm)}
.acts{display:flex;gap:4px;margin-top:6px}
.acts button{background:none;border:0;color:var(--txm);font-size:.85rem;min-height:36px;padding:0 8px;border-radius:8px}
.acts button:hover{background:var(--bg-soft)}
.note{margin-top:8px;font-size:.85rem;color:var(--warn);background:var(--bg-soft);border-radius:var(--r-sm);padding:6px 10px}
.eb{background:var(--surface);border:1px solid var(--err);color:var(--err);border-radius:var(--r-md);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
[data-theme=dark] .eb{color:#FCA5A5}
.welcome{text-align:center;padding:40px 0 10px}
.welcome h1{font-size:2rem;margin:10px 0}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.comp{padding:8px 16px calc(8px + env(safe-area-inset-bottom,0))}
.cbox{max-width:760px;margin:auto;display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--bs);border-radius:var(--r-xl);box-shadow:var(--sh-md);padding:6px 6px 6px 16px}
.cbox:focus-within{box-shadow:var(--glow-md);border-color:var(--blue6)}
.cbox textarea{flex:1;border:0;background:none;resize:none;font:inherit;color:var(--tx);max-height:160px;padding:9px 0;outline:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--g-primary);color:#fff;font-size:18px}
.send:disabled{opacity:.5;cursor:not-allowed}
.disc{max-width:760px;margin:6px auto 0;text-align:center;font-size:.78rem;color:var(--txm)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:var(--surface);border-radius:var(--r-xl);padding:24px;max-width:440px;width:100%;box-shadow:var(--sh-lg)}
.dlg h3{margin-bottom:8px}.dlg .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg-page);padding:10px 18px;border-radius:999px;z-index:60;font-size:.9rem}
.set{max-width:640px;margin:0 auto;padding:24px 16px;display:grid;gap:16px;overflow:auto}
.nf{min-height:70vh;display:grid;place-items:center;text-align:center}
.nf b{font:800 7rem/1 var(--fh);background:var(--g-primary);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 24px rgba(99,102,241,.3))}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,var(--bg-soft),var(--border),var(--bg-soft));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:1023px){.side{position:fixed;z-index:40;inset:30px auto 0 0;transform:translateX(-100%)}.side.open{transform:none;box-shadow:var(--sh-lg)}.mob{display:inline-block!important}}
.mob{display:none}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.grid,.g4{grid-template-columns:1fr 1fr}}
@media(max-width:767px){.links.d{display:none}.menu-b{display:block}.links.d.show{display:flex;position:absolute;top:64px;left:0;right:0;flex-direction:column;background:var(--surface);padding:12px;border-bottom:1px solid var(--border)}.grid,.g4,.ex{grid-template-columns:1fr}.mu{max-width:90%}}

/* ===== SaaS landing ===== */
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border:1px solid var(--border);background:var(--glass);border-radius:999px;font-size:.85rem;color:var(--tx2);box-shadow:var(--sh-md)}
.pill b{background:var(--g-primary);color:#fff;border-radius:999px;padding:2px 10px;font-size:.75rem}
.h{position:relative;text-align:center;padding:72px 0 0;overflow:hidden}
.h:before{content:"";position:absolute;left:50%;top:-10%;width:1100px;max-width:160%;height:700px;transform:translateX(-50%);background:var(--g-glow);pointer-events:none}
.h .wrap{position:relative}
.h h1{font-size:clamp(2.4rem,6vw,4.25rem);font-weight:800;letter-spacing:-.02em;margin:22px auto 16px;max-width:15ch}
.h p.lead{color:var(--tx2);font-size:1.15rem;max-width:56ch;margin:0 auto 28px}
.h .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.h .fine{margin-top:14px;font-size:.85rem;color:var(--txm)}
.frame{margin:48px auto 0;max-width:980px;border:1px solid var(--border);border-radius:20px 20px 0 0;background:var(--surface);box-shadow:0 30px 80px rgba(99,102,241,.22),var(--glow-md);overflow:hidden;text-align:left}
.fbar{display:flex;gap:6px;align-items:center;padding:10px 14px;background:var(--bg-soft);border-bottom:1px solid var(--border)}
.fbar i{width:10px;height:10px;border-radius:50%;background:var(--bs)}
.fbar span{margin:0 auto;font-size:.75rem;color:var(--txm);background:var(--surface);border-radius:8px;padding:2px 40px}
.fbody{display:grid;grid-template-columns:230px 1fr;min-height:340px}
.fside{border-right:1px solid var(--border);padding:12px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.fside .fake{height:36px;border-radius:10px;background:var(--bg-soft);padding:8px 10px;font-size:.85rem;color:var(--tx2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fside .fake.on{background:var(--g-soft);box-shadow:var(--glow-sm);color:var(--tx)}
.fmain{padding:20px;display:grid;gap:12px;align-content:start;background:var(--bg-page)}
.fmain .mu{max-width:70%}
.logos{padding:36px 0 8px;text-align:center;color:var(--txm);font-size:.85rem}
.logos div{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:12px;font:700 1.05rem var(--fh);color:var(--tx2)}
.sec{padding:80px 0}
.sec.soft{background:var(--g-soft)}
.sh{text-align:center;max-width:640px;margin:0 auto 40px}
.sh h2{font-size:clamp(1.8rem,3.5vw,2.6rem);letter-spacing:-.01em;margin:12px 0 10px}
.sh p{color:var(--tx2)}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.bc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:24px;box-shadow:var(--sh-md);overflow:hidden;display:flex;flex-direction:column;gap:8px}
.bc h3{font-size:1.1rem}.bc p{color:var(--tx2);font-size:.95rem}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}
.ico{width:40px;height:40px;border-radius:12px;background:var(--g-soft);border:1px solid var(--border);display:grid;place-items:center;font-size:18px}
.mini{margin-top:auto;display:grid;gap:6px;padding-top:10px}
.mini .fake{border-radius:10px;background:var(--bg-soft);padding:6px 10px;font-size:.8rem;color:var(--tx2)}
.mini .lang{display:flex;gap:6px;flex-wrap:wrap}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.stp{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-xl);padding:22px;box-shadow:var(--sh-md)}
.stp .n{width:34px;height:34px;border-radius:50%;background:var(--g-primary);color:#fff;display:grid;place-items:center;font-weight:700;margin-bottom:12px;box-shadow:var(--glow-sm)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--bs);background:var(--surface);color:var(--tx2);font-weight:600}
.tab[aria-selected=true]{background:var(--g-primary);color:#fff;border-color:transparent;box-shadow:var(--glow-sm)}
.tp{max-width:720px;margin:auto;display:grid;gap:12px}
.faq{max-width:760px;margin:auto;display:grid;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:4px 18px}
.faq summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600;list-style:none;justify-content:space-between}
.faq summary::after{content:"+";color:var(--blue6);font-size:1.3rem}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--tx2);padding-bottom:14px}
.cta2{margin:0 20px;border-radius:32px;background:var(--g-primary);color:#fff;text-align:center;padding:64px 20px;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.cta2:before{content:"";position:absolute;inset:-40% -10% auto;height:120%;background:radial-gradient(50% 50% at 50% 50%,rgba(255,255,255,.22),transparent)}
.cta2>*{position:relative}.cta2 h2{font-size:clamp(1.8rem,4vw,2.8rem);margin-bottom:10px}.cta2 p{opacity:.9;margin-bottom:22px}
.cta2 .btn{background:#fff;color:var(--purple7);border:0}
.fcols{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}
.fcols h4{font:700 .9rem var(--fh);margin-bottom:10px;color:var(--tx)}
.fcols a{display:block;margin:0 0 8px;color:var(--tx2);text-decoration:none}
.fcols a:hover{color:var(--blue6)}
@media(max-width:900px){.bento{grid-template-columns:1fr 1fr}.c2,.c3,.c4{grid-column:span 2}.steps{grid-template-columns:1fr 1fr}.fcols{grid-template-columns:1fr 1fr}}

</style>
</head>

function md(src){ /* safe Markdown: escape first, no raw HTML */
 let h=esc(src);const blocks=[];
 h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(_,l,c)=>{blocks.push(`<div class="cb"><header><span>${l||'code'}</span><button data-copy="${btoa(unescape(encodeURIComponent(c)))}">Copy</button></header><pre><code>${c}</code></pre></div>`);return '\u0000'+(blocks.length-1)+'\u0000'});
 h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<i>$1</i>');
 h=h.split(/\n{2,}/).map(p=>/^\s*- /.test(p)?'<ul>'+p.split('\n').map(l=>'<li>'+l.replace(/^\s*- /,'')+'</li>').join('')+'</ul>':'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
 return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]).replace(/<p>(<div class="cb">[\s\S]*?<\/div>)<\/p>/g,'$1');
}

function notFound(){return nav()+`<div class="nf"><div><b>404</b><h2>We couldn't find that page</h2><p style="margin:8px 0 16px;color:var(--tx2)">The link may be wrong or the page moved.</p><a class="btn p" href="#/">Go home</a> <a class="btn" href="#/chat">Open chat</a></div></div>`}
function modal(){
 if(S.modal==='onb'){const C=[['Welcome to NeuroChat','Ask questions, get answers, and keep every conversation.'],['How conversations work','Follow-ups use earlier messages. Titles come from your first message. History is saved in the sidebar.'],['Use it responsibly','AI can be wrong. Verify important answers.']];const s=S.step||0;return `<div class="ov" role="dialog" aria-modal="true"><div class="dlg"><span class="badge">${s+1} of 3</span><h3 style="margin-top:8px">${C[s][0]}</h3><p style="color:var(--tx2)">${C[s][1]}</p><div class="row"><button class="btn" data-onb="skip">Dismiss</button><button class="btn p" data-onb="next">${s<2?'Next':'Got it'}</button></div></div></div>`}
 if(S.modal&&S.modal.del){const c=S.convs.find(x=>x.id===S.modal.del);return `<div class="ov" role="dialog" aria-modal="true"><div class="dlg"><h3>Delete conversation?</h3><p style="color:var(--tx2)">“${esc(c.title)}” and its messages will be deleted. This cannot be undone.</p><div class="row"><button class="btn" data-m="no">Cancel</button><button class="btn p" data-m="yes">Delete</button></div></div></div>`}
 if(S.modal&&S.modal.ren){const c=S.convs.find(x=>x.id===S.modal.ren);return `<div class="ov" role="dialog" aria-modal="true"><div class="dlg"><h3>Rename conversation</h3><input type="text" id="rn" maxlength="100" value="${esc(c.title)}" aria-label="New title"><div class="row"><button class="btn" data-m="no">Cancel</button><button class="btn p" data-m="rs">Save</button></div></div></div>`}
 return ''}
/* ===== Render ===== */
function render(){
 document.documentElement.dataset.theme=S.theme;document.documentElement.lang=S.lang;
 const r=route(),root=$('#root');const prot=/^\/(chat|settings)/.test(r);
 if(prot&&!S.user){go('/login?redirect='+encodeURIComponent(r));return}
 if(S.user&&/^\/(login|register)/.test(r)){go('/chat');return}
 let h;
 if(r==='/'||r.startsWith('/#'))h=landing();else if(r.startsWith('/login'))h=authView(0);else if(r==='/register')h=authView(1);else if(r==='/privacy'||r==='/terms')h=legal(r.slice(1));else if(r.startsWith('/chat'))h=chatView();else if(r==='/settings')h=settings();else h=notFound();
 root.innerHTML=h+modal();wire();
 const ml=$('#ml');if(ml)ml.scrollTop=ml.scrollHeight;
 if(S.modal&&S.modal.ren){const i=$('#rn');i&&i.focus()}
}
/* ===== Events ===== */
function wire(){
 const on=(s,ev,f)=>{const e=$(s);e&&e.addEventListener(ev,f)};
 on('#mb','click',()=>$('#lk').classList.toggle('show'));
 document.querySelectorAll('[data-try]').forEach(b=>b.onclick=()=>{S.pending=b.dataset.try;go(S.user?'/chat':'/register')});
 document.querySelectorAll('[data-sc]').forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById(a.dataset.sc);if(el)el.scrollIntoView({behavior:'smooth'});else{go('/');setTimeout(()=>{const x=document.getElementById(a.dataset.sc);x&&x.scrollIntoView()},50)}});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const y=scrollY;S.uc=+b.dataset.tab;render();scrollTo(0,y)});
 const af=$('#af');if(af)authWire(af);
 on('#nc','click',()=>go('/chat'));on('#dm','click',()=>{S.drawer=!S.drawer;$('#sd').classList.toggle('open',S.drawer)});
 on('#lo','click',()=>{S.user=null;save();go('/');toast('Logged out')});
 on('#sq','input',e=>{S.q=e.target.value;clearTimeout(S.dt);S.dt=setTimeout(()=>{render();const q=$('#sq');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)});
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{S.err=null;go('/chat/'+b.dataset.open)});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.modal={del:b.dataset.del};render()});
 document.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{S.modal={ren:b.dataset.ren};render()});
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const m=S.modal,a=b.dataset.m;S.modal=null;if(a==='yes'){S.convs=S.convs.filter(c=>c.id!==m.del);save();if(route().includes(m.del))go('/chat');toast('Conversation deleted')}if(a==='rs'){const v=($('#rn')||{}).value;if(v&&v.trim()){S.convs.find(c=>c.id===m.ren).title=v.trim();save()}else{toast('Title cannot be empty')}}render()});
 document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>send(b.dataset.ex));
 document.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{const c=S.convs.find(x=>x.id===route().split('/')[2]);navigator.clipboard&&navigator.clipboard.writeText(c.msgs[b.dataset.cp].text).then(()=>toast('Copied'),()=>toast('Copy blocked by browser'))});
 document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(decodeURIComponent(escape(atob(b.dataset.copy)))).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1500)},()=>toast('Copy blocked by browser'))});
 document.querySelectorAll('[data-rg]').forEach(b=>b.onclick=retry);
 document.querySelectorAll('[data-onb]').forEach(b=>b.onclick=()=>{if(b.dataset.onb==='next'&&(S.step||0)<2){S.step=(S.step||0)+1}else{S.modal=null;S.step=0;S.onb=true;save()}render()});
 on('#ob','click',()=>{S.step=0;S.modal='onb';render()});
 const ta=$('#ta');if(ta){const sb=$('#snd');const upd=()=>{ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';const n=Array.from(ta.value).length;sb.disabled=!ta.value.trim()||n>4000||S.busy;$('#cc').textContent=n>3500?n+'/4000':''};ta.addEventListener('input',upd);ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!sb.disabled)send(ta.value)}});sb.onclick=()=>send(ta.value);if(S.pending){const p=S.pending;S.pending=null;setTimeout(()=>send(p),50)}else if(!S.busy)ta.focus()}
 on('#sn','change',e=>{const v=e.target.value.trim();if(v.length>=2){S.user.name=v;save();toast('Saved')}else toast('Name must be at least 2 characters')});
 on('#ul','change',e=>{S.lang=e.target.value;save();render()});on('#rl','change',e=>{S.reply=e.target.value;save();toast('Saved')});on('#th','change',e=>{S.theme=e.target.value;save();render()});
}
function authWire(f){
 const reg=!!$('#nm');const v=id=>($('#'+id)||{}).value||'';const er=(id,m)=>{$('#e-'+id).textContent=m};
 $('#sp').onchange=e=>{['pw','cp'].forEach(i=>{const x=$('#'+i);if(x)x.type=e.target.checked?'text':'password'})};
 if(reg)$('#pw').oninput=()=>{const p=v('pw');const s=(p.length>=8)+(/[A-Za-z]/.test(p)&&/\d/.test(p))+(p.length>=12&&/[^A-Za-z0-9]/.test(p));$('#mt').style.width=(p?(s+ (p?0:0))*33+1:0)+'%';$('#mtx').textContent=p?['Weak','Fair','Good','Strong'][s]+' — strength is guidance only':'Use 8+ characters, a letter and a number.'};
 $('#gg').onclick=()=>{const em='demo.google@example.com';let u=S.users.find(x=>x.email===em);if(!u){u={name:'Google Demo User',email:em,google:true};S.users.push(u)}login(u)};
 f.onsubmit=e=>{e.preventDefault();['nm','em','pw','cp','f'].forEach(i=>$('#e-'+i)&&er(i,''));let ok=true;const em=v('em').trim().toLowerCase(),pw=v('pw');
  if(reg){const n=Array.from(v('nm').trim()).length;if(n<2||n>60){er('nm','Enter your full name (2–60 characters).');ok=false}}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){er('em','Enter a valid email address.');ok=false}
  if(reg){if(pw.length<8||pw.length>72||!/[A-Za-z]/.test(pw)||!/\d/.test(pw)){er('pw','Password needs 8–72 characters, a letter and a number.');ok=false}if(pw!==v('cp')){er('cp','Passwords do not match.');ok=false}}else if(!pw){er('pw','Enter your password.');ok=false}
  if(!ok)return;const b=$('#sb');b.disabled=true;b.textContent='Please wait…';
  setTimeout(()=>{const ex=S.users.find(x=>x.email===em);
   if(reg){if(ex){b.disabled=false;b.textContent='Create account';er('f',ex.google?'This email uses Google sign-in. Continue with Google.':'An account with this email already exists. Log in instead?');return}const u={name:v('nm').trim(),email:em,pw};S.users.push(u);login(u,true)}
   else{if(!ex||ex.pw!==pw){b.disabled=false;b.textContent='Log in';er('f','Incorrect email or password');return}login(ex)}},500)};
}
function login(u,fresh){S.user=u;if(fresh||!S.onb){S.modal='onb';S.step=0}save();const q=decodeURIComponent((location.hash.split('redirect=')[1]||'')),ok=q.startsWith('/')&&!q.startsWith('//');go(ok?q:'/chat');toast(fresh?'Account created':'Signed in');render()}
/* ===== Chat logic ===== */
function send(text){
 text=(text||'').trim();if(!text||S.busy||Array.from(text).length>4000)return;
 const id=route().split('/')[2];let c=id&&S.convs.find(x=>x.id===id);
 if(!c){c={id:'c'+Date.now(),title:title(text),msgs:[],updated:Date.now()};S.convs.push(c);history.replaceState(null,'','#/chat/'+c.id)}
 c.msgs.push({role:'user',text,ts:Date.now()});c.updated=Date.now();S.err=null;save();ask(c,text)}
function ask(c,text){S.busy=true;render();
 setTimeout(()=>{S.busy=false;
  if(/^\/fail/.test(text)&&!c.failed){c.failed=true;S.err='NeuroChat is temporarily unavailable (simulated 503). Your message was saved.';render();return}
  c.msgs.push({role:'ai',text:aiReply(c,text),ts:Date.now(),sens:SENS.test(text)});c.updated=Date.now();save();render()},900+Math.random()*600)}
function retry(){const c=S.convs.find(x=>x.id===route().split('/')[2]);if(!c)return;let i=c.msgs.length-1;if(c.msgs[i].role==='ai')c.msgs.pop();const lu=[...c.msgs].reverse().find(m=>m.role==='user');S.err=null;ask(c,lu.text)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.modal){S.modal=null;render()}else if(S.drawer){S.drawer=false;render()}}});
render();
</script>
</body>
</html>
